<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NeonPulse | Mobile & Laptop Store</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Google Font: Inter + fallback -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #f5f0ff 0%, #f9eef7 100%);
      color: #1a102f;
      line-height: 1.5;
    }

    /* custom smooth scroll */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #e9dcff;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #a259ff, #ff66c0);
      border-radius: 10px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- HEADER (blue-pink-purple gradient) ---------- */
    .main-header {
      background: linear-gradient(105deg, #13294b 0%, #4a1d6d 50%, #c13584 100%);
      border-radius: 0 0 2.5rem 2.5rem;
      padding: 1.2rem 0 0.8rem;
      box-shadow: 0 20px 35px rgba(79, 39, 128, 0.25);
      margin-bottom: 2rem;
    }

    .header-content {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo-area h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ffe6f5, #ffffff);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      letter-spacing: -0.5px;
    }
    .logo-area p {
      color: #ffdbee;
      font-weight: 500;
      font-size: 0.8rem;
    }

    /* search bar */
    .search-bar {
      display: flex;
      background: white;
      border-radius: 60px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border: 1px solid rgba(255,255,255,0.3);
    }
    .search-bar input {
      border: none;
      padding: 12px 20px;
      width: 260px;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
    }
    .search-bar button {
      background: linear-gradient(135deg, #ff66c0, #9f4dff);
      border: none;
      padding: 0 24px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      font-size: 1rem;
    }
    .search-bar button:hover {
      background: linear-gradient(135deg, #ff85ce, #b16eff);
    }

    .cart-icon {
      background: rgba(255,255,240,0.2);
      backdrop-filter: blur(6px);
      padding: 10px 20px;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid rgba(255,215,245,0.6);
    }
    .cart-icon i {
      font-size: 1.3rem;
    }
    .cart-icon:hover {
      background: rgba(255,215,245,0.35);
      transform: scale(1.02);
    }

    /* category tabs */
    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin: 30px 0 25px;
    }
    .cat-btn {
      background: white;
      border: none;
      padding: 9px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: #3a2c5a;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.03);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cat-btn i {
      font-size: 1rem;
    }
    .cat-btn.active {
      background: linear-gradient(125deg, #8f5eff, #ff59b0);
      color: white;
      box-shadow: 0 8px 18px rgba(162, 89, 255, 0.35);
    }
    .cat-btn:hover:not(.active) {
      background: #f1e6ff;
      transform: translateY(-2px);
    }

    /* section header */
    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 1rem 0 1.2rem;
      border-left: 6px solid #ff69b4;
      padding-left: 16px;
    }
    .section-title h2 {
      font-size: 1.7rem;
      font-weight: 700;
      background: linear-gradient(120deg, #3a1c71, #d76d77, #ffaf7b);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .section-title span {
      color: #8168cc;
      font-weight: 500;
    }

    /* product grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 28px;
      margin-bottom: 50px;
    }

    /* product card with glassmorph + pink/blue accents */
    .product-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      overflow: hidden;
      transition: all 0.25s ease;
      box-shadow: 0 12px 28px rgba(93, 53, 140, 0.12);
      border: 1px solid rgba(255, 160, 210, 0.5);
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 25px 35px -12px rgba(128, 70, 200, 0.3);
      border-color: #ff98d0;
      background: white;
    }

    .product-img {
      background: linear-gradient(145deg, #f3ecff, #ffe4f0);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 210px;
      padding: 25px;
    }
    .product-img i {
      font-size: 5.5rem;
      color: #7749d8;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
      transition: 0.2s;
    }
    .product-card:hover .product-img i {
      transform: scale(1.02);
      color: #a155ff;
    }

    .product-info {
      padding: 1.2rem 1.2rem 1.3rem;
    }
    .product-title {
      font-weight: 700;
      font-size: 1.2rem;
      margin-bottom: 6px;
      color: #1b103f;
    }
    .product-desc {
      font-size: 0.8rem;
      color: #5a4a78;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge {
      background: #f0e4ff;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #9b4dff;
    }
    .price {
      font-weight: 800;
      font-size: 1.5rem;
      color: #2c1c55;
      margin: 10px 0 12px;
    }
    .price small {
      font-size: 0.8rem;
      font-weight: 500;
      color: #ff5f9e;
    }
    .add-to-cart {
      background: linear-gradient(95deg, #3a2c6e, #c33b89);
      border: none;
      width: 100%;
      padding: 12px 0;
      border-radius: 50px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      color: white;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .add-to-cart:hover {
      background: linear-gradient(95deg, #5842a0, #e055a5);
      gap: 14px;
    }

    /* footer with blue-pink vibes */
    .footer {
      background: linear-gradient(100deg, #0f1e3f, #2b154b);
      margin-top: 3rem;
      padding: 2rem 0 1.5rem;
      border-radius: 2rem 2rem 0 0;
      color: #eddaff;
    }
    .footer-content {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      align-items: center;
    }
    .footer .social i {
      font-size: 1.8rem;
      margin-left: 12px;
      color: #ffb3e0;
      transition: 0.2s;
    }
    .footer .social i:hover {
      color: #ff7bc1;
      transform: scale(1.1);
    }
    .footer small {
      opacity: 0.8;
    }

    /* empty state or filter message (hidden initially) */
    .empty-message {
      text-align: center;
      padding: 3rem;
      background: #fff0fc;
      border-radius: 2rem;
      color: #a44bff;
      font-weight: 500;
    }

    /* responsive */
    @media (max-width: 750px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }
      .search-bar input {
        width: 100%;
      }
      .cart-icon {
        justify-content: center;
      }
      .section-title h2 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

<header class="main-header">
  <div class="container header-content">
    <div class="logo-area">
      <h1><i class="fas fa-mobile-alt"></i> NeonPulse</h1>
      <p>✨ premium mobiles & laptops ✨</p>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search devices...">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
    <div class="cart-icon" id="cartPreview">
      <i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span> items
    </div>
  </div>
</header>

<div class="container">
  <!-- category filter -->
  <div class="categories" id="categoryFilters">
    <button class="cat-btn active" data-cat="all"><i class="fas fa-th-large"></i> All</button>
    <button class="cat-btn" data-cat="mobile"><i class="fas fa-mobile-alt"></i> Mobiles</button>
    <button class="cat-btn" data-cat="laptop"><i class="fas fa-laptop-code"></i> Laptops</button>
  </div>

  <div class="section-title">
    <h2><i class="fas fa-bolt" style="color:#ff66c0;"></i> Trending devices</h2>
    <span>⚡ blue • pink • purple essence</span>
  </div>

  <!-- products grid -->
  <div id="productsGridContainer" class="products-grid"></div>
</div>

<footer class="footer">
  <div class="container footer-content">
    <div>
      <h3 style="font-weight: 600;">✨ NeonPulse <span style="color:#ff98cf;">Store</span></h3>
      <p>Mobiles & Laptops with futuristic vibe</p>
    </div>
    <div class="social">
      <i class="fab fa-instagram"></i>
      <i class="fab fa-twitter"></i>
      <i class="fab fa-discord"></i>
    </div>
    <small>© 2025 — powered by blue💙 pink💖 purple💜</small>
  </div>
</footer>

<script>
  // ---------- PRODUCT DATABASE (ENGLISH) ----------
  const products = [
    { id: 1, name: "Galaxy A35 5G", category: "mobile", price: 499, description: "120Hz Super AMOLED", icon: "fas fa-mobile-alt", badge: "New" },
    { id: 2, name: "iPhone 15 Pro", category: "mobile", price: 1099, description: "A17 Pro · Titanium", icon: "fab fa-apple", badge: "Best Seller" },
    { id: 3, name: "Xiaomi 13T Pro", category: "mobile", price: 799, description: "Leica Camera · 144Hz", icon: "fas fa-mobile-alt", badge: "Flagship" },
    { id: 4, name: "ROG Zephyrus G14", category: "laptop", price: 1599, description: "Ryzen 9 · RTX 4060", icon: "fas fa-laptop-code", badge: "Gaming" },
    { id: 5, name: "MacBook Air M3", category: "laptop", price: 1299, description: "13.6” Liquid Retina", icon: "fab fa-apple", badge: "Ultrabook" },
    { id: 6, name: "Pixel 8 Pro", category: "mobile", price: 899, description: "AI Camera · Tensor G3", icon: "fab fa-android", badge: "AI" },
    { id: 7, name: "Spectre x360 14", category: "laptop", price: 1399, description: "2-in-1 OLED Touch", icon: "fas fa-laptop", badge: "Convertible" },
    { id: 8, name: "Legion Pro 7", category: "laptop", price: 2199, description: "i9-13900HX · RTX 4080", icon: "fas fa-desktop", badge: "Pro Gaming" },
    { id: 9, name: "Nothing Phone (2)", category: "mobile", price: 599, description: "Glyph Interface · 50MP", icon: "fas fa-mobile-alt", badge: "Unique" },
    { id: 10, name: "Razer Blade 15", category: "laptop", price: 2499, description: "240Hz · RTX 4070", icon: "fas fa-laptop-code", badge: "Elite" }
  ];

  // cart state
  let cart = [];   // each element { id, name, price, quantity }

  // current filters: category + search text
  let activeCategory = "all";
  let searchQuery = "";

  // Helper: update cart count badge
  function updateCartUI() {
    const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").innerText = totalItems;
    // optional mini animation
    const cartSpan = document.getElementById("cartCount");
    cartSpan.style.transform = "scale(1.2)";
    setTimeout(() => { if(cartSpan) cartSpan.style.transform = "scale(1)"; }, 180);
  }

  // add product to cart
  function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    const existing = cart.find(item => item.id === productId);
    if (existing) {
      existing.quantity += 1;
    } else {
      cart.push({ id: product.id, name: product.name, price: product.price, quantity: 1 });
    }
    updateCartUI();
    // simple feedback
    const btn = document.querySelector(`.add-to-cart[data-id='${productId}']`);
    if(btn) {
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check"></i> Added!';
      setTimeout(() => {
        if(btn) btn.innerHTML = originalText;
      }, 800);
    }
    console.log(`Cart: ${cart.length} items`);
  }

  // filter products based on category + search
  function getFilteredProducts() {
    let filtered = [...products];
    // category filter
    if (activeCategory !== "all") {
      filtered = filtered.filter(p => p.category === activeCategory);
    }
    // search filter (name & description)
    if (searchQuery.trim() !== "") {
      const query = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(p => p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
    }
    return filtered;
  }

  // render product cards dynamically
  function renderProducts() {
    const container = document.getElementById("productsGridContainer");
    const filtered = getFilteredProducts();

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty-message"><i class="fas fa-search" style="font-size: 2rem;"></i><br/>✨ No devices found ✨<br/>Try different keywords or category</div>`;
      return;
    }

    let cardsHTML = "";
    filtered.forEach(product => {
      // choose icon depending on product or keep stored icon
      let iconHtml = `<i class="${product.icon}"></i>`;
      // for apple products we keep branded icon, otherwise same
      cardsHTML += `
        <div class="product-card" data-id="${product.id}">
          <div class="product-img">
            ${iconHtml}
          </div>
          <div class="product-info">
            <div class="product-title">${product.name}</div>
            <div class="product-desc">
              <span>${product.description}</span>
              <span class="badge">${product.badge}</span>
            </div>
            <div class="price">$${product.price} <small>USD</small></div>
            <button class="add-to-cart" data-id="${product.id}">
              <i class="fas fa-cart-plus"></i> Add to cart
            </button>
          </div>
        </div>
      `;
    });

    container.innerHTML = cardsHTML;

    // attach event listeners to all "Add to cart" buttons
    document.querySelectorAll('.add-to-cart').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = parseInt(btn.getAttribute('data-id'));
        addToCart(id);
      });
    });
  }

  // high-level refresh after filters update
  function refreshShop() {
    renderProducts();
    // also highlight active category button
    document.querySelectorAll('.cat-btn').forEach(btn => {
      const catValue = btn.getAttribute('data-cat');
      if (catValue === activeCategory) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  // event listeners for categories
  function initCategoryEvents() {
    const catButtons = document.querySelectorAll('.cat-btn');
    catButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-cat');
        activeCategory = cat;
        refreshShop();
      });
    });
  }

  // search functionality
  function initSearchEvents() {
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    function performSearch() {
      searchQuery = searchInput.value;
      refreshShop();
    }
    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') {
        performSearch();
      }
    });
    // optional clear if needed but good
  }

  // cart preview click (just alert for demo)
  function initCartPreview() {
    const cartElem = document.getElementById('cartPreview');
    cartElem.addEventListener('click', () => {
      if (cart.length === 0) {
        alert("🛒 Your cart is empty. Add some trendy gadgets!");
      } else {
        let itemList = cart.map(item => `${item.name} x${item.quantity} - $${item.price * item.quantity}`).join('\n');
        let total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
        alert(`🛍️ Your items:\n${itemList}\n\n💰 Total: $${total}\n💙 Thanks for shopping at NeonPulse!`);
      }
    });
  }

  // additional hover / smooth
  function initDemoEffects() {
    // just for playful vibe: console greet
    console.log("✨ NeonPulse | blue-pink-purple theme active ✨");
  }

  // initial render + events
  function init() {
    renderProducts();
    initCategoryEvents();
    initSearchEvents();
    initCartPreview();
    initDemoEffects();
    updateCartUI();
  }

  init();
</script>
</body>
</html>
